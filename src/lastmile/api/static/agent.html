<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Mile · My queue</title><link rel="stylesheet" href="/static/console.css"><link rel="stylesheet" href="/static/app.css">
<style>
.queue-hero{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}
.queue-list{display:grid;gap:8px}
.task{display:grid;grid-template-columns:42px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.task.open{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.task .rank{font-family:var(--mono);font-size:16px;color:var(--primary);font-weight:700}
.task-main{cursor:pointer;min-width:0}
.task-main:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:5px}
.task h3{margin:0 0 4px;font-size:14px}
.task p{margin:0;font-size:12px;color:var(--ink-3)}
.task .actions{display:flex;gap:5px}
.task .action{font-family:var(--mono);font-weight:700;font-size:12px}
.queue-meta{display:flex;flex-wrap:wrap;gap:8px}
.queue-meta span{font-size:12px;padding:4px 8px;background:var(--panel-2);border-radius:5px}

.state{font:600 10.5px/1.7 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:0 8px;border-radius:5px;
  border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.state.released{border-color:var(--primary);color:var(--primary)}
.state.worked{background:var(--good);border-color:var(--good);color:#fff}
.state.approved{border-color:var(--ink-2);color:var(--ink-2)}

/* filter chips above the queue */
.qfilters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip-btn{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);color:var(--ink-3);cursor:pointer}
.chip-btn b{color:var(--ink-2)}
.chip-btn.on{border-color:var(--primary);color:var(--primary);background:var(--panel-2)}
.chip-btn.on b{color:var(--primary)}

/* the account card: the surface the work is done from */
.card{grid-column:1/-1;margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.card-sec{padding:12px 0;border-bottom:1px solid var(--line)}
.card-sec:last-child{border-bottom:0;padding-bottom:2px}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.card-h b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.card-h .btn{margin-left:auto}
.hint{margin:6px 0 0;font-size:11.5px;color:var(--ink-3)}
.doit{margin:0;display:flex;align-items:baseline;gap:10px}
.doit .action{font-size:15px;font-weight:700;font-family:inherit}
.doit .hint{margin:0}

blockquote.script{margin:0;padding:12px 14px;border-left:3px solid var(--primary);border-radius:0 7px 7px 0;
  background:var(--panel-2);font-size:14px;line-height:1.6;white-space:pre-wrap}

dl.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0}
dl.facts div{min-width:0}
dl.facts dt{font-size:11px;color:var(--ink-3);margin-bottom:2px}
dl.facts dd{margin:0;font-size:14px;font-weight:600}

.card-sec.care p{margin:0;font-size:13px;padding:10px 12px;border-radius:7px;
  background:var(--warn-soft,var(--panel-2));border:1px solid var(--line)}

.channels{display:flex;flex-wrap:wrap;gap:6px}
.chan{font:inherit;font-size:12px;padding:6px 11px;border:1px dashed var(--line);border-radius:6px;
  background:transparent;color:var(--ink-3);cursor:pointer}
.chan.on{border-style:solid;border-color:var(--primary);color:var(--primary);font-weight:600}

.outcome{margin-top:10px;padding:10px 12px;border-radius:7px;background:var(--panel-2);font-size:12.5px}
.outcome b{font-size:13px}
.outcome .meta{color:var(--ink-3);font-size:11.5px;margin-top:3px}
.outcome .note{margin-top:6px;white-space:pre-wrap}
.linky{font:inherit;font-size:11.5px;border:0;background:none;padding:0;color:var(--primary);
  cursor:pointer;text-decoration:underline}
ol.hist{margin:8px 0 0;padding-left:18px;display:grid;gap:7px}
ol.hist li{font-size:12px}
ol.hist .meta{color:var(--ink-3);font-size:11px;margin-left:6px}

.oform{display:grid;gap:8px}
.oform .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.oform label{font-size:12.5px;color:var(--ink-2)}
.oform select,.oform input,.oform textarea{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:inherit}
.oform textarea{width:100%;min-height:62px;resize:vertical}
.oform .hint{margin:0}

@media(max-width:560px){
  .task{grid-template-columns:34px 1fr}
  .task .actions,.task .state{grid-column:2}
  .queue-hero{display:block}
}
</style></head>
<body><main class="page">
<section class="queue-hero">
  <div><p class="eyebrow">Collection agent workspace</p><h2>My queue for today</h2>
  <p class="muted" id="subtitle">Loading your assigned work…</p></div>
  <button class="btn primary" id="save" disabled>Save queue order</button>
</section>

<section class="summary" id="summary"></section>

<section class="panel">
  <div class="panel-h"><b>Work in this order</b>
    <span class="muted">Open an account to see what to say. Once an action goes out, record what happened —
      your manager keeps approval and release authority.</span></div>
  <div class="panel-b">
    <div class="qfilters" id="filters"></div>
    <div id="queue"><div class="empty">Loading queue…</div></div>
  </div>
</section>

<section class="panel" style="margin-top:16px">
  <div class="panel-h"><b>Today’s results</b><button class="btn small" id="copyResults">Copy summary</button></div>
  <div class="panel-b" id="results"><p class="muted">Loading…</p></div>
</section>
</main>
<script src="/static/common.js"></script><script src="/static/shell.js"></script><script src="/static/agent.js"></script>
</body></html>
