<!doctype html><meta charset="utf-8"><title>fig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --ground:#EDF2F2; --surface:#FFFFFF; --surface-2:#F4F8F8; --sunk:#E4ECEC;
  --ink:#0F2429; --ink-2:#41565A; --ink-3:#697C7F; --line:#C7D5D5; --line-2:#DDE7E7;
  --teal:#11606B; --teal-soft:#DCECEE; --violet:#63479C; --violet-soft:#EAE4F5;
  --amber:#875B12; --amber-soft:#F5EAD6; --rust:#9C3B26; --rust-soft:#F7E4DF;
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1214; --surface:#121B1E; --surface-2:#172226; --sunk:#0D1618;
  --ink:#E3ECEC; --ink-2:#AEC0C1; --ink-3:#7D9294; --line:#2B3C40; --line-2:#1F2D31;
  --teal:#6BBFC8; --teal-soft:#0F323A; --violet:#B69CE4; --violet-soft:#241C35;
  --amber:#D7A557; --amber-soft:#2C2416; --rust:#E0846B; --rust-soft:#341913;
}}
:root[data-theme="dark"]{
  --ground:#0B1214; --surface:#121B1E; --surface-2:#172226; --sunk:#0D1618;
  --ink:#E3ECEC; --ink-2:#AEC0C1; --ink-3:#7D9294; --line:#2B3C40; --line-2:#1F2D31;
  --teal:#6BBFC8; --teal-soft:#0F323A; --violet:#B69CE4; --violet-soft:#241C35;
  --amber:#D7A557; --amber-soft:#2C2416; --rust:#E0846B; --rust-soft:#341913;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.6 var(--sans);
  padding-inline:20px;padding-block:36px 72px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:34px}
.kicker{font:600 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
h1{margin:0;font:600 clamp(28px,3.6vw,40px)/1.14 var(--serif);letter-spacing:-.015em;text-wrap:balance}
h2{margin:0;font:600 clamp(20px,2.2vw,25px)/1.2 var(--serif);letter-spacing:-.01em;text-wrap:balance}
h3{margin:0;font:600 16px/1.35 var(--sans);letter-spacing:-.005em}
p{margin:0}
a{color:var(--teal)}
.lede{color:var(--ink-2);font-size:17px;max-width:70ch}
header{display:grid;gap:12px}
section{display:grid;gap:16px}
.sec-head{display:grid;gap:8px;max-width:78ch}
.sec-head p{color:var(--ink-2)}
.num{font:600 11.5px/1 var(--mono);color:var(--ink-3);letter-spacing:.12em}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* strip of figures */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.strip div{background:var(--surface);padding:15px 17px;display:grid;gap:3px}
.strip b{font:600 26px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.strip span{font-size:12.5px;color:var(--ink-3);line-height:1.4}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;
  align-content:start}
.card ul,.card ol{margin:0;padding-left:19px;display:grid;gap:7px;font-size:14px;color:var(--ink-2)}
.card li b,.card li strong{color:var(--ink);font-weight:600}
.card > p{font-size:14px;color:var(--ink-2)}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
caption{text-align:left;padding:14px 16px 0;font-size:13px;color:var(--ink-3)}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
thead th{position:sticky;top:0;background:var(--surface-2);font:600 11.5px/1.3 var(--mono);letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.f{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--ink)}
th.grp{background:var(--sunk);font:600 11.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);padding:8px 14px;border-bottom:1px solid var(--line)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}

/* badges */
.b{display:inline-block;font:600 10.5px/1.7 var(--mono);letter-spacing:.05em;padding:0 7px;border-radius:4px;
  white-space:nowrap;border:1px solid transparent;text-transform:uppercase}
.b-rule{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.b-model{background:var(--teal-soft);color:var(--teal);border-color:var(--teal)}
.b-money{background:var(--ink);color:var(--surface)}
.b-label{background:transparent;color:var(--ink);border-color:var(--ink)}
.b-shown{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.b-unused{background:transparent;color:var(--rust);border:1px dashed var(--rust)}
.b-pii{background:var(--violet-soft);color:var(--violet);border-color:var(--violet)}
.b-key{background:transparent;color:var(--ink-3);border:1px dotted var(--ink-3)}
.bs{display:flex;gap:4px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center}
.legend span.i{display:inline-flex;gap:6px;align-items:center}

/* callouts */
.note{border-left:3px solid var(--teal);background:var(--surface);border-radius:0 8px 8px 0;padding:14px 18px;
  display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.note.warn{border-left-color:var(--rust)}
.note.gate{border-left-color:var(--amber)}
.note b{color:var(--ink)}
.note h3{margin-bottom:2px}
code{font-family:var(--mono);font-size:.87em;background:var(--surface-2);padding:1px 5px;border-radius:4px;
  border:1px solid var(--line-2)}
.note code,td code{background:transparent;border:0;padding:0}
footer{color:var(--ink-3);font-size:13px;display:grid;gap:6px;max-width:80ch}
@media (max-width:520px){ body{padding-inline:16px} .strip b{font-size:22px} }
</style>
<style>
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;
  overflow-x:auto}
figure svg{display:block;width:100%;height:auto;font-family:var(--sans)}
#f1 svg{min-width:1160px} #f2 svg{min-width:900px}
figcaption{margin-top:12px;font-size:13.5px;color:var(--ink-3);max-width:96ch}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.box-dash{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:5 4}
.zone{fill:var(--surface-2);stroke:var(--line);stroke-width:1.2}
.person{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.4}
.pm{fill:var(--ink);stroke:none}
.pml{fill:var(--surface);font:600 13px var(--mono)}
.gate{fill:var(--amber-soft);stroke:var(--amber);stroke-width:1.3}
.api{fill:var(--sunk);stroke:var(--ink-3);stroke-width:1.2}
.agent{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.5}
.bank{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.4}
.llm{fill:var(--violet-soft);stroke:var(--violet);stroke-width:1.6}
.store{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.3}
.tool{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.rule{stroke:var(--ink-3);stroke-width:1;fill:none}
text.t{fill:var(--ink);font-size:13px;font-weight:600}
text.s{fill:var(--ink-3);font-size:11px}
text.m{fill:var(--ink-3);font-size:10.5px;font-family:var(--mono)}
text.lbl{fill:var(--ink-3);font-size:10.5px;font-weight:700;letter-spacing:.12em}
text.lbl-v{fill:var(--violet)}
text.lbl-a{fill:var(--amber)}
text.lbl-t{fill:var(--teal)}
.sep{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 4;fill:none;opacity:.6}
#f0 svg{min-width:1040px}
text.bt{fill:var(--ink);font-size:16px;font-weight:600;letter-spacing:-.005em}
text.bs{fill:var(--ink-3);font-size:12.5px}
text.eq{fill:var(--ink);font-size:14px;font-family:var(--mono);font-weight:500}
text.tag{fill:var(--ink-3);font:700 10px var(--mono);letter-spacing:.11em}
text.tag-v{fill:var(--violet);font:700 10px var(--mono);letter-spacing:.11em}
text.ag{fill:var(--teal);font:600 10.5px var(--mono);letter-spacing:.06em}
text.flow{fill:var(--ink-2);font-size:12px;font-style:italic}
#f3 svg{min-width:1100px} #f4 svg{min-width:1100px} #f5 svg{min-width:1400px}
text.el{fill:var(--ink-2);font-size:11px}
text.prop{fill:var(--ink-3);font:700 9px var(--mono);letter-spacing:.1em}
.edge{stroke:var(--ink-2);stroke-width:1.5;fill:none}
.llmedge{stroke:var(--violet);stroke-width:1.8;fill:none}
.read{stroke:var(--ink-3);stroke-width:1.4;fill:none;stroke-dasharray:1.5 3.5;stroke-linecap:round}
.write{stroke:var(--teal);stroke-width:1.5;fill:none;stroke-dasharray:7 4}
.ch-full{fill:var(--ink);stroke:none}
.ch-read{fill:none;stroke:var(--ink-2);stroke-width:1.1}
.ch-none{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 2}
text.cht{fill:var(--ink-3);font:600 9.5px var(--mono)}
text.cht-on{fill:var(--surface)}
.keys{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center;
  padding:2px 0}
.keys .i{display:inline-flex;gap:7px;align-items:center}
.keys svg{width:34px;height:12px;flex:none;min-width:0}
.swatch{width:13px;height:13px;border-radius:3px;flex:none;display:inline-block}
</style>
<style>body{padding:0;margin:0;background:var(--surface)}svg{width:1600px;height:auto;display:block}</style>

<rect class="person" x="40.0" y="16" width="389.3333333333333" height="54" rx="8"/><circle class="pm" cx="66.0" cy="43" r="14"/><text class="pml" x="66.0" y="48" text-anchor="middle">A</text><text class="bt" x="90.0" y="38" text-anchor="start">Admin</text><text class="bs" x="90.0" y="57" text-anchor="start">banks, rules and who has access</text><path class="edge" d="M234.66666666666666,70 V82" marker-end="url(#arr)"/><rect class="person" x="445.3333333333333" y="16" width="389.3333333333333" height="54" rx="8"/><circle class="pm" cx="471.3333333333333" cy="43" r="14"/><text class="pml" x="471.3333333333333" y="48" text-anchor="middle">M</text><text class="bt" x="495.3333333333333" y="38" text-anchor="start">Collections manager</text><text class="bs" x="495.3333333333333" y="57" text-anchor="start">runs the day, approves, releases</text><path class="edge" d="M640.0,70 V82" marker-end="url(#arr)"/><rect class="person" x="850.6666666666666" y="16" width="389.3333333333333" height="54" rx="8"/><circle class="pm" cx="876.6666666666666" cy="43" r="14"/><text class="pml" x="876.6666666666666" y="48" text-anchor="middle">C</text><text class="bt" x="900.6666666666666" y="38" text-anchor="start">Collection agent</text><text class="bs" x="900.6666666666666" y="57" text-anchor="start">works only their own queue</text><path class="edge" d="M1045.3333333333333,70 V82" marker-end="url(#arr)"/><rect class="gate" x="40" y="84" width="1200" height="36" rx="8"/><text class="bt" x="58" y="107" text-anchor="start">Sign-in gate</text><text class="bs" x="170" y="107" text-anchor="start">the role decides which consoles open, and is re-checked on every page and every API call</text><text class="tag" x="1224" y="107" text-anchor="end">OPERATE  ·  MANAGE</text><path class="edge" d="M340,120 V134" marker-end="url(#arr)"/><rect class="bank" x="40" y="136" width="380" height="120" rx="8"/><text class="bt" x="58" y="163" text-anchor="start">Bank systems</text><text class="tag" x="404" y="162" text-anchor="end">THE PREDICTION ALREADY EXISTS</text><text class="bs" x="58" y="186" text-anchor="start">Riverbend CU — risk as grades A–E</text><text class="bs" x="58" y="204" text-anchor="start">Harbor — risk as a 180-day probability</text><path class="edge" d="M420,196 H460" marker-end="url(#arr)"/><rect class="box" x="470" y="136" width="400" height="128" rx="8"/><text class="bt" x="488" y="163" text-anchor="start">Ingest &amp; prepare</text><text class="bs" x="488" y="186" text-anchor="start">six feeds over the bank's own API · 13 quality gates</text><text class="bs" x="488" y="204" text-anchor="start">names and phones → identity vault, never past here</text><text class="bs" x="488" y="222" text-anchor="start">their score recalibrated to one scale · LGD · exposure</text><text class="ag" x="854" y="253" text-anchor="end">Ingestion · Data Steward</text><path class="edge" d="M870,196 H910" marker-end="url(#arr)"/><rect class="box" x="880" y="136" width="360" height="128" rx="8"/><text class="bt" x="898" y="163" text-anchor="start">Decision state</text><text class="bs" x="898" y="186" text-anchor="start">one row per delinquent account,</text><text class="bs" x="898" y="204" text-anchor="start">true as of this morning and nothing later —</text><text class="bs" x="898" y="222" text-anchor="start">point-in-time, or the model learns the answer</text><text class="ag" x="1224" y="253" text-anchor="end">Feature Agent</text><text class="lbl" x="40" y="280" text-anchor="start">THE DECISION</text><path class="edge" d="M1060,256 V272 H234.66666666666666 V286" marker-end="url(#arr)"/><path class="edge" d="M640.0,272 V286" marker-end="url(#arr)"/><path class="edge" d="M1045.3333333333333,272 V286" marker-end="url(#arr)"/><path class="edge" d="M234.66666666666666,272 H1045.3333333333333"/><rect class="gate" x="40.0" y="288" width="389.3333333333333" height="158" rx="8"/><text class="bt" x="58.0" y="315" text-anchor="start">What may we do?</text><text class="tag" x="413.3333333333333" y="314" text-anchor="end">RULES, NOT A MODEL</text><text class="bs" x="58.0" y="338" text-anchor="start">consent per channel · do-not-call</text><text class="bs" x="58.0" y="356" text-anchor="start">deceased · bankruptcy · litigation · fraud</text><text class="bs" x="58.0" y="374" text-anchor="start">hardship history · days past due</text><text class="bs" x="58.0" y="392" text-anchor="start">7 attempts / 7 days · 1 contact / day</text><text class="ag" x="413.3333333333333" y="435" text-anchor="end">Policy Agent</text><text class="flow" x="246.66666666666666" y="470" text-anchor="start">eligible actions per account</text><rect class="box" x="445.3333333333333" y="288" width="389.3333333333333" height="158" rx="8"/><text class="bt" x="463.3333333333333" y="315" text-anchor="start">What is at stake?</text><text class="tag" x="818.6666666666666" y="314" text-anchor="end">ARITHMETIC</text><text class="bs" x="463.3333333333333" y="338" text-anchor="start">the bank's own score, recalibrated</text><text class="bs" x="463.3333333333333" y="356" text-anchor="start">to a 12-month probability of default</text><text class="bs" x="463.3333333333333" y="374" text-anchor="start">× exposure × loss given default</text><text class="bs" x="463.3333333333333" y="392" text-anchor="start">we never retrain their model</text><text class="ag" x="818.6666666666666" y="435" text-anchor="end">Feature Agent</text><text class="flow" x="652.0" y="470" text-anchor="start">expected loss if it does not cure</text><rect class="agent" x="850.6666666666666" y="288" width="389.3333333333333" height="158" rx="8"/><text class="bt" x="868.6666666666666" y="315" text-anchor="start">What would change if we act?</text><text class="tag" x="1224.0" y="314" text-anchor="end">OUR MODEL</text><text class="bs" x="868.6666666666666" y="338" text-anchor="start">bagged T-learner — 6 × gradient boosting</text><text class="bs" x="868.6666666666666" y="356" text-anchor="start">P(cure | action) − P(cure | nothing)</text><text class="bs" x="868.6666666666666" y="374" text-anchor="start">one estimate per action, with a range</text><text class="bs" x="868.6666666666666" y="392" text-anchor="start">Persuadable · Sure Thing · Lost Cause · Sleeping Dog</text><text class="ag" x="1224.0" y="435" text-anchor="end">Decision Agent</text><text class="flow" x="1057.3333333333333" y="470" text-anchor="start">uplift per action</text><path class="edge" d="M234.66666666666666,504 H1045.3333333333333"/><path class="edge" d="M234.66666666666666,446 V504"/><path class="edge" d="M640.0,446 V504"/><path class="edge" d="M1045.3333333333333,446 V504"/><path class="edge" d="M640.0,504 V528" marker-end="url(#arr)"/><rect class="box" x="40" y="528" width="1200" height="64" rx="8"/><text class="bt" x="58" y="555" text-anchor="start">Expected value</text><text class="eq" x="58" y="578" text-anchor="start">uplift  ×  ( probability of default × exposure × loss given default )  −  the cost of acting</text><text class="tag" x="1224" y="554" text-anchor="end">THE RANKING A RISK SCORE CANNOT PRODUCE</text><path class="edge" d="M440,592 V618" marker-end="url(#arr)"/><rect class="box" x="40" y="618" width="800" height="128" rx="8"/><text class="bt" x="58" y="645" text-anchor="start">Optimise, then assign</text><text class="tag" x="824" y="644" text-anchor="end">A SOLVER, NOT THE LLM</text><text class="bs" x="58" y="668" text-anchor="start">mixed-integer program (PuLP / CBC): maximise total value subject to team</text><text class="bs" x="58" y="686" text-anchor="start">minutes, handling time per action, contact caps, one action per account</text><text class="bs" x="58" y="704" text-anchor="start">then first-fit-decreasing packing into each collector's shift, repair re-solve</text><text class="ag" x="824" y="735" text-anchor="end">Decision Agent</text><rect class="box" x="895" y="618" width="345" height="122" rx="8"/><text class="bt" x="913" y="645" text-anchor="start">Checked before anyone is called</text><text class="bs" x="913" y="668" text-anchor="start">Monte Carlo × 2,000 → p10 / p50 / p90</text><text class="bs" x="913" y="686" text-anchor="start">SimPy shift simulation → will it finish?</text><text class="bs" x="913" y="704" text-anchor="start">compared with sort-by-risk and sort-by-value</text><path class="read" d="M891,679 H844" marker-end="url(#arrRead)"/><path class="edge" d="M440,740 V766" marker-end="url(#arr)"/><rect class="gate" x="40" y="766" width="1200" height="48" rx="8"/><text class="bt" x="58" y="795" text-anchor="start">Every rule re-checked against the finished plan</text><text class="bs" x="470" y="795" text-anchor="start">a different code path from the gate above, so a plan that broke a cap after solving is caught — and the run fails closed</text><path class="edge" d="M440,814 V840" marker-end="url(#arr)"/><rect class="llm" x="40" y="840" width="1200" height="58" rx="8"/><text class="bt" x="58" y="867" text-anchor="start">Explain it in plain language</text><text class="bs" x="58" y="888" text-anchor="start">facts stamped with their source  →  the LLM drafts the wording  →  checked back against those facts, one rewrite allowed</text><text class="tag-v" x="1224" y="866" text-anchor="end">THE LLM WRITES THE SENTENCE, NEVER THE NUMBER</text><path class="llmedge" d="M1240,869 H1268" marker-end="url(#arrLlm)"/><path class="edge" d="M440,898 V924" marker-end="url(#arr)"/><rect class="gate" x="40" y="924" width="1200" height="48" rx="8"/><text class="bt" x="58" y="953" text-anchor="start">A person approves every action, then releases it</text><text class="bs" x="470" y="953" text-anchor="start">nothing above this line has contacted anybody · approver and reason recorded in the audit chain</text><path class="edge" d="M440,972 V998" marker-end="url(#arr)"/><rect class="bank" x="40" y="998" width="1200" height="78" rx="8"/><text class="bt" x="58" y="1025" text-anchor="start">The bank executes — and tells us what happened</text><text class="bs" x="58" y="1048" text-
